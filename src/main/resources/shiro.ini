
[urls]

# Batch job section.
# The React pages and the logout endpoint must stay public. The pages hold no data, and
# the React app sends a logged-out user to its login form, remembering the requested tab.
# /job/login is both that form (GET) and the login endpoint (POST). Every other /job/*
# endpoint requires an authenticated JOB_USER.
# First match wins, so the public exceptions are listed before the catch-all.
/job = anon
/job/new = anon
/job/current = anon
/job/history = anon
/job/login = anon
/job/logout = anon
/job/** = roles[JOB_USER]

# Allow access to everything else
/** = anon
