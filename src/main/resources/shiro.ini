
[urls]

# Admin Pages
/admin/home = roles[ADMIN]

# Batch job section.
# The React entry page and the login/logout endpoints must stay public so users can
# authenticate; every other /job/* endpoint requires an authenticated JOB_USER.
# First match wins, so the public exceptions are listed before the catch-all.
/job = anon
/job/login = anon
/job/logout = anon
/job/** = roles[JOB_USER]

# Allow access to everything else
/** = anon
