# Source and columns for district types that come from a known dataset.
#
# Sourced by update_district_geometry.sh with DISTRICT_TYPE set. An entry here replaces
# the command line and the prompts both: a listed type is always loaded from its
# DEF_SOURCE, the script having rejected a SOURCE argument for it, and its columns are
# taken from here rather than asked for. Changing any of them means editing this file.
#
#   DEF_SOURCE     Layer URL (or zip path) this type is loaded from.
#   ID_COLUMN      Identifying column that SAGE keys the type's districts on.
#                  May need to be constructed.
#   EXTRA_COLUMNS  Comma-separated extra columns to keep, as named in the source.
#
# The load keeps these columns and drops the rest, so a column a post-load hook or SAGE
# reads has to be listed. Column names are matched against the source case-insensitively
# and land in the table lowercased.
#
# Names are the hooks' business: SAGE reads them out of "name", so a type with names either
# has a source column already called that, or post_load/<type>.sql renames or builds one.
#
# A type with no entry here has to be given a source on the command line, is prompted for
# its id column, and keeps nothing else.

# NYS Civil Boundaries, published by NYS ITS GIS. The layer numbers come from the
# service's own listing (append '?f=json' to the URL below) and are not guaranteed to
# survive a republication of the service.
CIVIL_BOUNDARIES="https://services6.arcgis.com/EbVsqZ18sv1kVJ3k/arcgis/rest/services/NYS_Civil_Boundaries/FeatureServer"

# NYS Elections Districts and Polling Locations, same publisher. Layers 0-3 are polling
# site points, which SAGE has no use for; layer 4 is the election district polygons.
NYS_ELECTIONS="https://services6.arcgis.com/EbVsqZ18sv1kVJ3k/arcgis/rest/services/NYS_Elections_Districts_and_Polling_Locations/FeatureServer"

# LATFOR, which actually draws the legislative and congressional lines.
# Note that the paths below change when a chamber's districts are redrawn.
LATFOR="https://latfor.state.ny.us/maps"

case "${DISTRICT_TYPE^^}" in
# A district that is split across islands is several rows in these files (senate 26 and
# assembly 61 each come in three pieces), so the loaded table has more rows than districts
# until /cleanMaps unions the ones sharing a DISTRICT into one.
SENATE)
  DEF_SOURCE="$LATFOR/senate2022/SEN22_June_03_2022.zip"
  ID_COLUMN="DISTRICT"
  ;;
ASSEMBLY)
  DEF_SOURCE="$LATFOR/2024assembly/assembly_shapefile_2024.zip"
  ID_COLUMN="DISTRICT"
  ;;
CONGRESSIONAL)
  DEF_SOURCE="$LATFOR/2024_Congress/CON24_shapefile_Feb_28_2024.zip"
  ID_COLUMN="DISTRICT"
  ;;
COUNTY)
  DEF_SOURCE="$CIVIL_BOUNDARIES/2"  # Counties
  ID_COLUMN="GNIS_ID"
  EXTRA_COLUMNS="NAME,FIPS_CODE,SWIS"
  ;;
TOWN_CITY)
  DEF_SOURCE="$CIVIL_BOUNDARIES/6"  # Cities_Towns
  ID_COLUMN="GNIS_ID"
  EXTRA_COLUMNS="NAME,MUNI_TYPE,COUNTY,FIPS_CODE"
  ;;
VILLAGE)
  DEF_SOURCE="$CIVIL_BOUNDARIES/7"  # Villages
  ID_COLUMN="GNIS_ID"
  EXTRA_COLUMNS="NAME,FIPS_CODE,COUNTY,TOWN"
  ;;
ELECTION)
  DEF_SOURCE="$NYS_ELECTIONS/4"  # Election Districts
  # Election_District reads like 'Conklin 4': municipality-qualified but not county-
  # qualified. post_load/election.sql has to build name from COUNTY and ELECTION_DISTRICT.
  ID_COLUMN="id"
  EXTRA_COLUMNS="COUNTY,MUNICIPALITY,ELECTION_DISTRICT"
  ;;
CITY_COUNCIL)
  # NYC only, published by the city rather than the state. The layer carries nothing but
  # the district number, which is distinct across all 51 rows.
  DEF_SOURCE="https://services5.arcgis.com/GfwWNkhOj9bNBqoJ/arcgis/rest/services/NYC_City_Council_Districts/FeatureServer/0"
  ID_COLUMN="CounDist"
  ;;
ELECTRIC_UTILITY)
  # data.ny.gov is Socrata, not ArcGIS, so this is its GeoJSON export rather than a
  # feature service layer; GDAL reads the URL directly.
  DEF_SOURCE="https://data.ny.gov/api/geospatial/awza-4vgu?method=export&format=GeoJSON"
  # This ID is built.
  ID_COLUMN="id"
  EXTRA_COLUMNS="comp_full,comp_id"
  ;;
esac
